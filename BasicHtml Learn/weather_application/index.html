<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
    <link google-fonts rel="preconnect" href="https://fonts.googleapis.com" />
  </head>
  <body>
    <div class="app">
      <h1>Weather Application</h1>
      <div class="container">
        <div>
          <h1>Weather Application Based on Latitude and Longitude</h1>
          <section class="weather-input">
            <input type="text" placeholder="Enter Latitude" id="latitude" />
            <input type="text" placeholder="Enter Longitude" id="longitude" />
            <button onclick="getWeather()">Get Weather</button>
          </section>
          <section class="weather-result">
            <h2>Weather Result:</h2>
            <p id="temperature"></p>
            <p id="windspeed"></p>
          </section>
        </div>
        <div>
          <h1>Weather Application Based on City Name</h1>
          <section class="weather-input">
            <input type="text" placeholder="Enter City Name" id="city" />
            <button onclick="getWeatherByCity()">Get Weather</button>
          </section>
          <section class="weather-result">
            <h2>Weather Result:</h2>
            <p id="temperature-city"></p>
            <p id="windspeed-city"></p>
          </section>
        </div>
      </div>
    </div>
    <script src="index.js"></script>
  </body>
</html>
